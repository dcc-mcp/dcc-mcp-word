tools:
- name: generate_document
  execution: sync
  affinity: any
  enforce_thread_affinity: false
  job_strategy: monolithic
  annotations:
    idempotent_hint: true
  description: >-
    Compile a Word IR JSON (office-ir/1.0 word envelope) into a native DOCX
    through the headless Open XML backend, then reopen the artifact and verify
    every paragraph and table cell against the source IR. No Word installation
    required. Returns the artifact path, the read-back verdict (paragraphs and
    cells checked, mismatches) and a structural validation report. Use for any
    docx generation task: technical reports, call sheets, approval forms.
  input_schema:
    type: object
    properties:
      input:
        type: string
        description: Path to the Word IR JSON file
      output_dir:
        type: string
        description: Directory for the generated docx artifact
      verify:
        type: boolean
        description: Reopen the artifact and compare every paragraph and table cell against the IR
        default: true
    required: [input, output_dir]
  call_examples:
  - arguments: {"input": "document.json", "output_dir": "out"}
    note: Compile a document and read it back to verify every paragraph
  - arguments: {"input": "document.json", "output_dir": "out", "verify": false}
    note: Compile the DOCX only, skipping the read-back step
- name: validate_document
  execution: sync
  affinity: any
  enforce_thread_affinity: false
  job_strategy: monolithic
  annotations:
    read_only_hint: true
    idempotent_hint: true
  description: >-
    Validate a Word IR JSON (contract + structural checks) or check that
    produced artifacts exist and are non-empty. Returns ok/checks/warnings —
    host-limited features (TOC rebuild, field updates) are reported as declared
    but unverified, never as passing checks.
  input_schema:
    type: object
    properties:
      input:
        type: string
        description: Path to the Word IR JSON file, or a directory of artifacts
    required: [input]
  call_examples:
  - arguments: {"input": "document.json"}
    note: Validate a Word IR envelope before compiling
  - arguments: {"input": "out"}
    note: Check that produced artifacts exist and are non-empty
- name: inspect_document
  execution: sync
  affinity: any
  enforce_thread_affinity: false
  job_strategy: monolithic
  annotations:
    read_only_hint: true
    idempotent_hint: true
  description: >-
    Read-only inventory of an existing DOCX: paragraph styles and text, table
    contents, header/footer text, section count and field-instruction count.
    Run before editing a document you did not generate.
  input_schema:
    type: object
    properties:
      input:
        type: string
        description: Path to the DOCX file
    required: [input]
  call_examples:
  - arguments: {"input": "out/tech-report.docx"}
    note: Inventory a generated document before handing it off
